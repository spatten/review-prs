[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-launcher"
version = "0.2.0"
description = "Launch Claude Code cloud reviews from macOS clipboard links"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
review-prs = "review_prs.cli:main"

[tool.setuptools.package-data]
review_prs = ["clipboard.js"]
